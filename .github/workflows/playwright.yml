name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Await Vercel Preview Deployment (PR)
        if: github.event_name == 'pull_request'
        uses: vercel/wait-for-deployment-action@main
        id: vercel_pr_deployment
        with:
          environment: preview

      - name: Install Vercel CLI
        if: github.event_name == 'push'
        run: npm install -g vercel@latest

      - name: Pull Vercel Preview Env
        if: github.event_name == 'push'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        if: github.event_name == 'push'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_VERCEL_ENV: 'preview'
          VERCEL_ENV: 'preview'

      - name: Deploy prebuilt (as preview)
        if: github.event_name == 'push'
        id: vercel_main_deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"

      - name: Set Deployment URL
        id: deployment_url
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "url=${{ steps.vercel_pr_deployment.outputs.deployment-url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.vercel_main_deploy.outputs.deployment-url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node Modules
        run: npm ci

      - name: Run Playwright Tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.deployment_url.outputs.url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ steps.deployment_url.outputs.url }}
          E2E_CHROMIUM_EMAIL: ${{ secrets.E2E_CHROMIUM_EMAIL }}
          E2E_CHROMIUM_PASSWORD: ${{ secrets.E2E_CHROMIUM_PASSWORD }}
          E2E_FIREFOX_EMAIL: ${{ secrets.E2E_FIREFOX_EMAIL }}
          E2E_FIREFOX_PASSWORD: ${{ secrets.E2E_FIREFOX_PASSWORD }}
          E2E_WEBKIT_EMAIL: ${{ secrets.E2E_WEBKIT_EMAIL }}
          E2E_WEBKIT_PASSWORD: ${{ secrets.E2E_WEBKIT_PASSWORD }}

      - name: Upload Playwright Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts-failure
          path: playwright-report/
          retention-days: 14

      - name: Promote to Production
        if: github.event_name == 'push' && success()
        run: vercel promote ${{ steps.deployment_url.outputs.url }} --token=${{ secrets.VERCEL_TOKEN }}
