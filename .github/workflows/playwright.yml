name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Await Vercel Deployment
        uses: vercel/wait-for-deployment-action@main
        id: vercel_deployment
        with:
          environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node Modules
        run: npm ci

      - name: Run Playwright Tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.vercel_deployment.outputs.deployment-url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ steps.vercel_deployment.outputs.deployment-url }}
          NEXT_PUBLIC_E2E_TEST: 'true'
          E2E_TEST: 'true'
          E2E_CHROMIUM_EMAIL: ${{ secrets.E2E_CHROMIUM_EMAIL }}
          E2E_CHROMIUM_PASSWORD: ${{ secrets.E2E_CHROMIUM_PASSWORD }}
          E2E_FIREFOX_EMAIL: ${{ secrets.E2E_FIREFOX_EMAIL }}
          E2E_FIREFOX_PASSWORD: ${{ secrets.E2E_FIREFOX_PASSWORD }}
          E2E_WEBKIT_EMAIL: ${{ secrets.E2E_WEBKIT_EMAIL }}
          E2E_WEBKIT_PASSWORD: ${{ secrets.E2E_WEBKIT_PASSWORD }}

      - name: Upload Playwright Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts-failure
          path: playwright-report/
          retention-days: 14
